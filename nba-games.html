<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Game Center | The Eurostep</title>
    <link rel="icon" type="image/png" href="the eurostep rounded.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #030508; color: #f3f4f6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 45px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(3, 5, 8, 0.92); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; }
        .brand-container { display: flex; align-items: center; gap: 12px; text-decoration: none; transition: transform 0.3s ease, filter 0.3s ease; }
        .brand-container:hover { transform: scale(1.02); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4)); }
        .brand-logo { height: 52px; width: auto; object-fit: contain; }
        .brand-title-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 1.5px; background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .nav-menu { display: flex; align-items: center; gap: 35px; list-style: none; }
        .nav-link { color: #d1d5db; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 0; transition: color 0.3s ease; display: block; }
        .nav-link:hover { color: #ffffff; }

        .games-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; z-index: 1; width: 100%; display: flex; flex-direction: column; gap: 25px; }
        .games-header-section { text-align: center; }
        .games-page-title { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: #ffffff; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; }
        .games-page-subtitle { color: #9ca3af; font-size: 0.95rem; }

        /* Barra delle date con freccia sinistra e destra posizionate correttamente */
        .date-nav-wrapper { display: flex; align-items: center; gap: 12px; background: rgba(11, 15, 25, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 20px; border-radius: 14px; backdrop-filter: blur(12px); position: relative; }
        .month-indicator { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px; white-space: nowrap; position: relative; }
        
        .calendar-icon-btn { background: none; border: none; color: #60a5fa; cursor: pointer; font-size: 1rem; transition: transform 0.2s; }
        .calendar-icon-btn:hover { transform: scale(1.15); }

        /* Popup Custom Calendario con z-index alto in primo piano */
        .custom-calendar-popup { display: none; position: absolute; top: 45px; left: 0; background: rgba(11, 15, 25, 0.98); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 99999; backdrop-filter: blur(20px); min-width: 260px; }
        .custom-calendar-popup.active { display: block; }
        .calendar-popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #ffffff; }
        .calendar-popup-header button { background: none; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.75rem; }
        .calendar-day-header { color: #9ca3af; font-weight: 600; padding-bottom: 6px; font-family: 'Orbitron', sans-serif; }
        .calendar-day-cell { padding: 8px 4px; border-radius: 6px; cursor: pointer; color: #d1d5db; transition: background 0.2s; }
        .calendar-day-cell:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .calendar-day-cell.selected { background: #60a5fa; color: #030508; font-weight: 700; }
        .calendar-day-cell.muted { color: #4b5563; }

        .rounds-scroll-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; scrollbar-color: rgba(96, 165, 250, 0.4) rgba(11, 15, 25, 0.8); flex: 1; }
        .rounds-scroll-container::-webkit-scrollbar { height: 6px; }
        .rounds-scroll-container::-webkit-scrollbar-track { background: rgba(11, 15, 25, 0.8); border-radius: 3px; }
        .rounds-scroll-container::-webkit-scrollbar-thumb { background: rgba(96, 165, 250, 0.4); border-radius: 3px; }

        .round-btn { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; padding: 10px 18px; background: rgba(11, 15, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; color: #9ca3af; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; text-transform: uppercase; }
        .round-btn.active, .round-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(96, 165, 250, 0.4); color: #ffffff; box-shadow: 0 0 15px rgba(96, 165, 250, 0.1); }

        .arrow-btn { background: rgba(11, 15, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); color: #f3f4f6; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; flex-shrink: 0; }
        .arrow-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(96, 165, 250, 0.4); color: #60a5fa; }

        /* Stile Card Partite */
        .matches-list { display: flex; flex-direction: column; gap: 15px; }
        .match-card { background: rgba(11, 15, 25, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; backdrop-filter: blur(12px); overflow: hidden; transition: all 0.3s ease; position: relative; z-index: 1; }
        .match-card:hover { border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); }
        
        .match-main-row { padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; flex-wrap: wrap; gap: 15px; }
        .match-info { font-size: 0.8rem; color: #9ca3af; font-family: 'Orbitron', sans-serif; min-width: 120px; }
        
        .teams-matchup { display: flex; align-items: center; gap: 30px; flex: 1; justify-content: center; }
        .team-box { display: flex; align-items: center; gap: 12px; width: 220px; }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-logo { width: 32px; height: 32px; object-fit: contain; }
        .team-name { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: #9ca3af; }
        .team-name.winner { color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }

        .score-box { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; color: #ffffff; background: rgba(255, 255, 255, 0.04); padding: 6px 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); min-width: 90px; text-align: center; }
        .score-box.upcoming { font-size: 0.9rem; color: #9ca3af; font-weight: 600; }

        .boxscore-link { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 700; color: #9ca3af; letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s ease; text-align: right; }
        .match-card:hover .boxscore-link { color: #60a5fa; text-shadow: 0 0 10px rgba(96, 165, 250, 0.4); }

        .boxscore-section { display: none; background: rgba(7, 10, 16, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 25px; }
        .match-card.expanded .boxscore-section { display: block; }
        
        .boxscore-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #ffffff; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; border-left: 3px solid #60a5fa; padding-left: 10px; }
        
        /* Tabella Box Score con colonne NBA e blocco prima colonna (Player) */
        .table-responsive { overflow-x: auto; overflow-y: auto; max-height: 550px; margin-bottom: 25px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.06); }
        .table-responsive::-webkit-scrollbar { height: 14px; width: 10px; }
        .table-responsive::-webkit-scrollbar-track { background: rgba(15, 22, 36, 0.95); border-radius: 0 0 12px 12px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .table-responsive::-webkit-scrollbar-thumb { background: rgba(96, 165, 250, 0.4); border-radius: 7px; border: 3px solid rgba(15, 22, 36, 0.95); }

        .boxscore-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; white-space: nowrap; }
        .boxscore-table th { background: rgba(15, 22, 36, 0.95); color: #9ca3af; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 10; text-align: center; }
        .boxscore-table th:first-child { text-align: left; }
        .boxscore-table td { padding: 12px; color: #d1d5db; border-bottom: 1px solid rgba(255, 255, 255, 0.04); background: rgba(11, 15, 25, 0.9); text-align: center; }
        .boxscore-table td:first-child { text-align: left; }
        .boxscore-table tbody tr:hover td { background: rgba(255, 255, 255, 0.05); color: #ffffff; }

        /* Colonna Player Fissa */
        .boxscore-table th:first-child, .boxscore-table td:first-child {
            position: sticky; left: 0; z-index: 5; background: #0b0f19 !important; border-right: 2px solid rgba(255, 255, 255, 0.12); min-width: 200px; max-width: 200px; overflow: hidden; text-overflow: ellipsis;
        }
        .boxscore-table th:first-child { z-index: 15; background: #0f1624 !important; }

        .loading-text { text-align: center; padding: 40px; color: #9ca3af; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .back-home-container { display: flex; justify-content: center; margin-top: 10px; }
        .back-home-btn { display: inline-block; padding: 10px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #ffffff; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 1px; transition: all 0.3s ease; }
        .back-home-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }

        footer { text-align: center; padding: 25px; border-top: 1px solid rgba(255, 255, 255, 0.05); color: #4b5563; font-size: 0.85rem; letter-spacing: 1px; z-index: 1; display: flex; justify-content: center; gap: 20px; align-items: center; }
        footer a { color: #6b7280; text-decoration: none; transition: color 0.2s ease; }
        footer a:hover { color: #ffffff; }

        @media (max-width: 768px) { 
            header { padding: 15px 20px; } 
            .teams-matchup { flex-direction: column; gap: 10px; } 
            .team-box.home, .team-box.away { justify-content: center; text-align: center; } 
            .date-nav-wrapper { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    
    <header>
        <a href="index.html" class="brand-container" title="The Eurostep Home">
            <img src="the eurostep rounded.png" alt="The Eurostep Logo" class="brand-logo">
            <span class="brand-title-text">The Eurostep</span>
        </a>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Back</a></li>
        </ul>
    </header>

    <main class="games-container">
        <div class="games-header-section">
            <h1 class="games-page-title">NBA Game Center</h1>
            <p class="games-page-subtitle">Schedules, results, and detailed box scores for the NBA regular season.</p>
        </div>

        <!-- Barra delle date con freccia sinistra a sinistra, giorni al centro e freccia destra a destra -->
        <div class="date-nav-wrapper">
            <div class="month-indicator">
                <button class="calendar-icon-btn" id="calendarToggle" title="Select Date"><i class="fa-regular fa-calendar-days"></i></button>
                <span id="currentMonthLabel">November 2026</span>
                
                <!-- Popup Custom Calendario -->
                <div class="custom-calendar-popup" id="customCalendar">
                    <div class="calendar-popup-header">
                        <button id="calPrevMonth">&lt;</button>
                        <span id="calMonthTitle">November 2026</span>
                        <button id="calNextMonth">&gt;</button>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
            </div>
            
            <!-- Freccia Sinistra posizionata prima dei giorni -->
            <button class="arrow-btn" id="prevWeekBtn" title="Previous Week"><i class="fa-solid fa-chevron-left"></i></button>
            
            <div class="rounds-scroll-container" id="daysContainer"></div>
            
            <!-- Freccia Destra posizionata a destra dei giorni -->
            <button class="arrow-btn" id="nextWeekBtn" title="Next Week"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="matches-list" id="gamesContainer">
            <div class="loading-text">Loading NBA Game Center...</div>
        </div>

        <div class="back-home-container">
            <a href="index.html" class="back-home-btn">&larr; Back to Home</a>
        </div>
    </main>

    <footer>
        <span>&copy; 2026 The Eurostep | Basketball Analysis. All rights reserved.</span>
        <a href="privacy.html">Privacy Policy</a>
    </footer>

    <script>
        let nbaData = {};
        let selectedDate = "2026-11-08";
        let popupDate = new Date(selectedDate);

        async function loadNbaData() {
            try {
                const response = await fetch('nba-games-data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('File dati NBA non trovato');
                const data = await response.json();
                nbaData = data.dates || {};
                
                const availableDates = Object.keys(nbaData).sort();
                if (availableDates.length > 0 && !nbaData[selectedDate]) {
                    selectedDate = availableDates[0];
                }
                
                renderDateBar();
                renderGames();
            } catch (err) {
                console.error("Errore caricamento NBA Game Center:", err);
                document.getElementById('gamesContainer').innerHTML = '<div class="loading-text">No games data found. Please run the python update script.</div>';
            }
        }

        function renderDateBar() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            const baseDate = new Date(selectedDate);
            
            for (let i = -3; i <= 3; i++) {
                const d = new Date(baseDate);
                d.setDate(baseDate.getDate() + i);
                const dateString = d.toISOString().split('T')[0];
                
                const btn = document.createElement('button');
                btn.className = `round-btn ${dateString === selectedDate ? 'active' : ''}`;
                btn.textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
                
                btn.onclick = () => {
                    selectedDate = dateString;
                    renderDateBar();
                    renderGames();
                };
                
                container.appendChild(btn);
            }

            document.getElementById('currentMonthLabel').textContent = baseDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        function renderGames() {
            const container = document.getElementById('gamesContainer');
            const games = nbaData[selectedDate] || [];

            if (games.length === 0) {
                container.innerHTML = `<div class="loading-text">No games scheduled for ${selectedDate}.</div>`;
                return;
            }

            container.innerHTML = '';
            games.forEach((game, index) => {
                const isPlayed = game.status === 'played';
                const homeWinner = isPlayed && game.homeScore > game.awayScore;
                const awayWinner = isPlayed && game.awayScore > game.homeScore;

                const card = document.createElement('div');
                card.className = 'match-card';
                card.id = `match-${index}`;

                let mainRowHTML = `
                    <div class="match-main-row" onclick="toggleBoxScore(${index}, ${isPlayed})">
                        <div class="match-info"><strong>${game.time || ''}</strong></div>
                        <div class="teams-matchup">
                            <div class="team-box home">
                                <span class="team-name ${homeWinner ? 'winner' : ''}">${game.homeTeam}</span>
                                <img src="${game.homeLogo || 'the eurostep rounded.png'}" alt="" class="team-logo" onerror="this.src='the eurostep rounded.png'">
                            </div>
                            <div class="score-box ${isPlayed ? '' : 'upcoming'}">
                                ${isPlayed ? `${game.homeScore} - ${game.awayScore}` : 'VS'}
                            </div>
                            <div class="team-box away">
                                <img src="${game.awayLogo || 'the eurostep rounded.png'}" alt="" class="team-logo" onerror="this.src='the eurostep rounded.png'">
                                <span class="team-name ${awayWinner ? 'winner' : ''}">${game.awayTeam}</span>
                            </div>
                        </div>
                        <div class="match-info" style="text-align: right;">
                            ${isPlayed ? '<span class="boxscore-link">Box Scores &rarr;</span>' : '<span style="color: #9ca3af; font-size: 0.8rem;">Upcoming</span>'}
                        </div>
                    </div>
                `;

                let boxScoreHTML = '';
                if (isPlayed && game.boxscore) {
                    boxScoreHTML = `
                        <div class="boxscore-section">
                            <div class="boxscore-title">${game.homeTeam} Statistics</div>
                            ${renderTeamTable(game.boxscore.homePlayers)}
                            <div class="boxscore-title" style="margin-top: 20px;">${game.awayTeam} Statistics</div>
                            ${renderTeamTable(game.boxscore.awayPlayers)}
                        </div>
                    `;
                }

                card.innerHTML = mainRowHTML + boxScoreHTML;
                container.appendChild(card);
            });
        }

        function renderTeamTable(players) {
            if (!players || players.length === 0) return '<p style="color:#9ca3af; font-size:0.85rem; padding: 10px;">No box score data available.</p>';
            
            let rows = '';
            players.forEach(p => {
                rows += `<tr>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.min}</td>
                    <td>${p.fgm}</td>
                    <td>${p.fga}</td>
                    <td>${p.fg_pct}</td>
                    <td>${p.tpm3}</td>
                    <td>${p.tpa3}</td>
                    <td>${p.tp_pct3}</td>
                    <td>${p.ftm}</td>
                    <td>${p.fta}</td>
                    <td>${p.ft_pct}</td>
                    <td>${p.oreb}</td>
                    <td>${p.dreb}</td>
                    <td><strong>${p.reb}</strong></td>
                    <td>${p.ast}</td>
                    <td>${p.stl}</td>
                    <td>${p.blk}</td>
                    <td>${p.to}</td>
                    <td>${p.pf}</td>
                    <td><strong>${p.pts}</strong></td>
                    <td>${p.plusMinus}</td>
                </tr>`;
            });

            return `
                <div class="table-responsive">
                    <table class="boxscore-table">
                        <thead>
                            <tr>
                                <th>PLAYER</th>
                                <th>MIN</th>
                                <th>FGM</th>
                                <th>FGA</th>
                                <th>FG%</th>
                                <th>3PM</th>
                                <th>3PA</th>
                                <th>3P%</th>
                                <th>FTM</th>
                                <th>FTA</th>
                                <th>FT%</th>
                                <th>OREB</th>
                                <th>DREB</th>
                                <th>REB</th>
                                <th>AST</th>
                                <th>STL</th>
                                <th>BLK</th>
                                <th>TO</th>
                                <th>PF</th>
                                <th>PTS</th>
                                <th>+/-</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function toggleBoxScore(matchIndex, isPlayed) {
            if (!isPlayed) return;
            const card = document.getElementById(`match-${matchIndex}`);
            if (card) card.classList.toggle('expanded');
        }

        // Custom Calendar Logic
        const calendarToggle = document.getElementById('calendarToggle');
        const customCalendar = document.getElementById('customCalendar');
        
        calendarToggle.onclick = (e) => {
            e.stopPropagation();
            customCalendar.classList.toggle('active');
            renderCustomCalendar();
        };

        document.addEventListener('click', (e) => {
            if (!customCalendar.contains(e.target) && e.target !== calendarToggle) {
                customCalendar.classList.remove('active');
            }
        });

        function renderCustomCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('calMonthTitle');
            grid.innerHTML = '';

            const year = popupDate.getFullYear();
            const month = popupDate.getMonth();

            title.textContent = popupDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const daysOfWeek = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
            daysOfWeek.forEach(d => {
                const div = document.createElement('div');
                div.className = 'calendar-day-header';
                div.textContent = d;
                grid.appendChild(div);
            });

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();

            const prevMonthDays = new Date(year, month, 0).getDate();
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const div = document.createElement('div');
                div.className = 'calendar-day-cell muted';
                div.textContent = prevMonthDays - i;
                grid.appendChild(div);
            }

            for (let i = 1; i <= totalDays; i++) {
                const div = document.createElement('div');
                div.className = 'calendar-day-cell';
                const mStr = String(month + 1).padStart(2, '0');
                const dStr = String(i).padStart(2, '0');
                const dateStr = `${year}-${mStr}-${dStr}`;

                if (dateStr === selectedDate) div.classList.add('selected');
                div.textContent = i;
                
                div.onclick = () => {
                    selectedDate = dateStr;
                    customCalendar.classList.remove('active');
                    renderDateBar();
                    renderGames();
                };
                grid.appendChild(div);
            }
        }

        document.getElementById('calPrevMonth').onclick = () => {
            popupDate.setMonth(popupDate.getMonth() - 1);
            renderCustomCalendar();
        };

        document.getElementById('calNextMonth').onclick = () => {
            popupDate.setMonth(popupDate.getMonth() + 1);
            renderCustomCalendar();
        };

        // Logica frecce settimana (salto di 7 giorni pulito)
        document.getElementById('prevWeekBtn').onclick = () => {
            let d = new Date(selectedDate);
            d.setDate(d.getDate() - 7);
            selectedDate = d.toISOString().split('T')[0];
            popupDate = new Date(selectedDate);
            renderDateBar();
            renderGames();
        };

        document.getElementById('nextWeekBtn').onclick = () => {
            let d = new Date(selectedDate);
            d.setDate(d.getDate() + 7);
            selectedDate = d.toISOString().split('T')[0];
            popupDate = new Date(selectedDate);
            renderDateBar();
            renderGames();
        };

        // Avvio
        loadNbaData();

        // Sfondo 3D Three.js
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 10;
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({ size: 0.015, color: 0xffffff, transparent: true, opacity: 0.6 }));
        scene.add(particlesMesh);
        camera.position.z = 3;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / 500;
            mouseY = (e.clientY - window.innerHeight / 2) / 500;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001 + (mouseX * 0.5 - particlesMesh.rotation.y) * 0.05;
            particlesMesh.rotation.x += 0.001 + (mouseY * 0.5 - particlesMesh.rotation.x) * 0.05;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
