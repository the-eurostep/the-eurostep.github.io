<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | The Eurostep</title>
    <link rel="icon" type="image/png" href="the eurostep rounded.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #030508;
            color: #f3f4f6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 45px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(3, 5, 8, 0.92);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .brand-container:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4));
        }

        .brand-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
        }

        .brand-title-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 35px;
            list-style: none;
        }

        .nav-link {
            color: #d1d5db;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 0;
            transition: color 0.3s ease;
            display: block;
        }

        .nav-link:hover {
            color: #ffffff;
        }

        /* Contenitore Form Contatti */
        .contact-container {
            max-width: 750px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(11, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            z-index: 1;
            width: 90%;
        }

        .contact-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .contact-subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #d1d5db;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-input, .form-textarea {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px 16px;
            color: #f3f4f6;
            font-size: 0.95rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .form-textarea {
            resize: vertical;
            min-height: 160px;
        }

        .submit-btn {
            margin-top: 10px;
            padding: 14px 24px;
            background: rgba(11, 15, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #4b5563;
            font-size: 0.85rem;
            letter-spacing: 1px;
            z-index: 1;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        footer a {
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <header>
        <a href="index.html" class="brand-container" title="The Eurostep Home">
            <img src="the eurostep rounded.png" alt="The Eurostep Logo" class="brand-logo">
            <span class="brand-title-text">The Eurostep</span>
        </a>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        </ul>
    </header>

    <main class="contact-container">
        <h1 class="contact-title">Send a message</h1>
        <p class="contact-subtitle">The message will be read directly by the administrator of The Eurostep, who will respond to you at the email address indicated below.</p>

        <!-- Form collegato a Web3Forms con la tua chiave -->
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
            <!-- Access Key generata -->
            <input type="hidden" name="access_key" value="ff8da274-a418-45fb-8d50-6aecc03ce4b3">

            <div class="form-group">
                <label for="email">Your e-mail address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" class="form-input" placeholder="Reason for contacting..." required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" class="form-textarea" placeholder="Write your message here..." required></textarea>
            </div>

            <!-- Opzionale: reindirizzamento dopo l'invio o impostazioni di cortesia -->
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <button type="submit" class="submit-btn">Send Message &rarr;</button>
        </form>
    </main>

    <footer>
        <span>&copy; 2026 The Eurostep | Basketball Analysis. All rights reserved.</span>
        <a href="privacy.html">Privacy Policy</a>
    </footer>

    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.015,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 3;

        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) / 500;
            mouseY = (event.clientY - window.innerHeight / 2) / 500;
        });

        function animate() {
            requestAnimationFrame(animate);
            targetX = mouseX * 0.5;
            targetY = mouseY * 0.5;

            particlesMesh.rotation.y += 0.001 + (targetX - particlesMesh.rotation.y) * 0.05;
            particlesMesh.rotation.x += 0.001 + (targetY - particlesMesh.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
