<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euroleague Standings | The Eurostep</title>
    <link rel="icon" type="image/png" href="the eurostep rounded.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #030508; color: #f3f4f6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 45px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(3, 5, 8, 0.92); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; }
        .brand-container { display: flex; align-items: center; gap: 12px; text-decoration: none; transition: transform 0.3s ease, filter 0.3s ease; }
        .brand-container:hover { transform: scale(1.02); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4)); }
        .brand-logo { height: 52px; width: auto; object-fit: contain; }
        .brand-title-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 1.5px; background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .nav-menu { display: flex; align-items: center; gap: 35px; list-style: none; }
        .nav-link { color: #d1d5db; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 0; transition: color 0.3s ease; display: block; }
        .nav-link:hover { color: #ffffff; }

        .stats-container { max-width: 900px; margin: 40px auto; padding: 0 20px; z-index: 1; width: 100%; display: flex; flex-direction: column; gap: 25px; }
        .stats-header-section { text-align: center; }
        .stats-page-title { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: #ffffff; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; }
        .stats-page-subtitle { color: #9ca3af; font-size: 0.95rem; }

        .table-wrapper { background: rgba(11, 15, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow-x: auto; overflow-y: auto; max-height: 700px; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); position: relative; }
        .table-wrapper::-webkit-scrollbar { height: 14px; width: 10px; }
        .table-wrapper::-webkit-scrollbar-track { background: rgba(15, 22, 36, 0.95); border-radius: 0 0 16px 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .table-wrapper::-webkit-scrollbar-thumb { background: rgba(96, 165, 250, 0.4); border-radius: 7px; border: 3px solid rgba(15, 22, 36, 0.95); transition: background 0.3s ease; }
        .table-wrapper::-webkit-scrollbar-thumb:hover { background: rgba(96, 165, 250, 0.8); }

        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; font-size: 0.9rem; }
        
        th { font-family: 'Orbitron', sans-serif; background: rgba(15, 22, 36, 0.95); position: sticky; top: 0; z-index: 10; color: #9ca3af; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer; user-select: none; transition: color 0.2s ease; }
        th:hover { color: #ffffff; }
        th span { margin-left: 5px; font-size: 0.65rem; color: #60a5fa; }
        
        td { padding: 14px 16px; color: #d1d5db; border-bottom: 1px solid rgba(255, 255, 255, 0.04); background: rgba(11, 15, 25, 0.8); }
        tbody tr { transition: background 0.2s ease; }
        tbody tr:hover td { background: rgba(255, 255, 255, 0.05); color: #ffffff; }

        /* Linee divisorie (tratteggiate tra 6°/7° e 10°/11°) */
        tr.playoff-cutoff td {
            border-bottom: 2px dashed rgba(96, 165, 250, 0.6);
        }
        tr.playin-cutoff td {
            border-bottom: 2px dashed rgba(96, 165, 250, 0.6);
        }

        /* Colonne fisse a sinistra */
        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            z-index: 5;
            background: #0b0f19 !important;
            width: 60px;
            text-align: center;
        }
        th:first-child { z-index: 15; background: #0f1624 !important; }

        th:nth-child(2), td:nth-child(2) {
            position: sticky;
            left: 60px;
            z-index: 5;
            background: #0b0f19 !important;
            border-right: 2px solid rgba(255, 255, 255, 0.12);
            min-width: 260px;
        }
        th:nth-child(2) { z-index: 15; background: #0f1624 !important; }

        .loading-text { text-align: center; padding: 40px; color: #9ca3af; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }

        .back-home-container { display: flex; justify-content: center; margin-top: 10px; }
        .back-home-btn { display: inline-block; padding: 10px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #ffffff; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 1px; transition: all 0.3s ease; }
        .back-home-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }

        footer { text-align: center; padding: 25px; border-top: 1px solid rgba(255, 255, 255, 0.05); color: #4b5563; font-size: 0.85rem; letter-spacing: 1px; z-index: 1; display: flex; justify-content: center; gap: 20px; align-items: center; }
        footer a { color: #6b7280; text-decoration: none; transition: color 0.2s ease; }
        footer a:hover { color: #ffffff; }
        @media (max-width: 768px) { header { padding: 15px 20px; } }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    <header>
        <a href="index.html" class="brand-container" title="The Eurostep Home">
            <img src="the eurostep rounded.png" alt="The Eurostep Logo" class="brand-logo">
            <span class="brand-title-text">The Eurostep</span>
        </a>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Back</a></li>
        </ul>
    </header>

    <main class="stats-container">
        <div class="stats-header-section">
            <h1 class="stats-page-title">Euroleague Standings</h1>
            <p class="stats-page-subtitle">Updated Euroleague regular season standings.</p>
        </div>

        <div class="table-wrapper">
            <table id="euroleagueTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)"># <span>↕</span></th>
                        <th onclick="sortTable(1)">TEAM <span>↕</span></th>
                        <th onclick="sortTable(2)">GP <span>↕</span></th>
                        <th onclick="sortTable(3)">W <span>↕</span></th>
                        <th onclick="sortTable(4)">L <span>↕</span></th>
                        <th onclick="sortTable(5)">WIN% <span>↕</span></th>
                    </tr>
                </thead>
                <tbody id="euroleagueBody">
                    <tr><td colspan="6" class="loading-text">Syncing Euroleague Standings...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="back-home-container">
            <a href="index.html" class="back-home-btn">&larr; Back to Home</a>
        </div>
    </main>

    <footer>
        <span>&copy; 2026 The Eurostep | Basketball Analysis. All rights reserved.</span>
        <a href="privacy.html">Privacy Policy</a>
    </footer>

    <script>
        let rawData = [];

        async function loadEuroleagueStandings() {
            try {
                const response = await fetch('euroleague-standings-data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('File non trovato');
                const data = await response.json();
                
                rawData = data.standings || [];
                renderTable(rawData);
            } catch (err) {
                console.error("Errore caricamento standings Eurolega:", err);
                document.getElementById('euroleagueBody').innerHTML = '<tr><td colspan="6" class="loading-text">Live feed sync in progress...</td></tr>';
            }
        }

        function renderTable(teams) {
            const tbody = document.getElementById('euroleagueBody');
            if (teams.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading-text">No standings data available.</td></tr>';
                return;
            }
            tbody.innerHTML = "";
            teams.forEach((t, index) => {
                let rowClass = "";
                if (index === 5) rowClass = "playoff-cutoff"; // Tratteggiata tra 6° e 7°
                if (index === 9) rowClass = "playin-cutoff";  // Tratteggiata tra 10° e 11°

                const row = `<tr class="${rowClass}">
                    <td><strong>${index + 1}</strong></td>
                    <td><strong>${t.Team || 'Unknown'}</strong></td>
                    <td>${t.GP !== undefined ? t.GP : 0}</td>
                    <td><strong>${t.W !== undefined ? t.W : 0}</strong></td>
                    <td>${t.L !== undefined ? t.L : 0}</td>
                    <td>${t.WinPct !== undefined ? t.WinPct : '.000'}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        let sortDirections = {};
        function sortTable(colIndex) {
            const tbody = document.getElementById('euroleagueTable').querySelector('tbody');
            const rowsArray = Array.from(tbody.querySelectorAll('tr'));
            if (rowsArray.length === 0 || rowsArray[0].querySelector('.loading-text')) return;

            let dir = sortDirections[colIndex] || 'none';
            // Per le sconfitte (col. 4), i valori più bassi sono migliori in alto -> 'asc' al primo click
            if (dir === 'none') {
                dir = (colIndex === 4) ? 'asc' : 'desc';
            } else if (dir === 'desc') {
                dir = 'asc';
            } else if (dir === 'asc') {
                dir = 'none';
            }
            sortDirections[colIndex] = dir;

            if (dir === 'none') {
                renderTable(rawData);
                return;
            }

            rowsArray.sort((a, b) => {
                let valA = a.querySelectorAll('td')[colIndex].textContent.trim();
                let valB = b.querySelectorAll('td')[colIndex].textContent.trim();

                valA = valA.replace('%', '').replace('.', '');
                valB = valB.replace('%', '').replace('.', '');

                const numA = parseFloat(valA), numB = parseFloat(valB);
                if (!isNaN(numA) && !isNaN(numB)) {
                    return dir === 'desc' ? numB - numA : numA - numB;
                } else {
                    return dir === 'desc' ? valB.localeCompare(valA) : valA.localeCompare(valB);
                }
            });

            tbody.innerHTML = "";
            rowsArray.forEach(row => tbody.appendChild(row));
        }

        loadEuroleagueStandings();

        // Canvas 3D Background
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 10;
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({ size: 0.015, color: 0xffffff, transparent: true, opacity: 0.6 }));
        scene.add(particlesMesh);
        camera.position.z = 3;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / 500;
            mouseY = (e.clientY - window.innerHeight / 2) / 500;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001 + (mouseX * 0.5 - particlesMesh.rotation.y) * 0.05;
            particlesMesh.rotation.x += 0.001 + (mouseY * 0.5 - particlesMesh.rotation.x) * 0.05;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
