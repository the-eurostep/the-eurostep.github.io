<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCAA Tournament Bracket | The Eurostep</title>
    <link rel="icon" type="image/png" href="the eurostep rounded.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #030508;
            color: #f3f4f6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 45px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(3, 5, 8, 0.92);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .brand-container:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4));
        }

        .brand-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
        }

        .brand-title-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 35px;
            list-style: none;
        }

        .nav-link {
            color: #d1d5db;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 0;
            transition: color 0.3s ease;
            display: block;
        }

        .nav-link:hover {
            color: #ffffff;
        }

        .bracket-sub-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .bracket-header-section {
            text-align: center;
            margin-bottom: 10px;
        }

        .bracket-page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .sections-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-card {
            background: rgba(11, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .section-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(16, 22, 36, 0.85);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .section-card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .section-card-action {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: #60a5fa;
            letter-spacing: 1px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }

        .section-card:hover .section-card-action {
            color: #ffffff;
        }

        .back-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #4b5563;
            font-size: 0.85rem;
            letter-spacing: 1px;
            z-index: 1;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        footer a {
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .section-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            header {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <header>
        <a href="index.html" class="brand-container" title="The Eurostep Home">
            <img src="the eurostep rounded.png" alt="The Eurostep Logo" class="brand-logo">
            <span class="brand-title-text">The Eurostep</span>
        </a>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        </ul>
    </header>

    <main class="bracket-sub-container">
        
        <div class="bracket-header-section">
            <h1 class="bracket-page-title">NCAA Tournament</h1>
        </div>

        <div class="sections-grid">
            
            <a href="#" class="section-card">
                <h2 class="section-card-title">Fill out the bracket</h2>
                <div class="section-card-action">Access &rarr;</div>
            </a>

            <a href="#" class="section-card">
                <h2 class="section-card-title">Rules & Prizes</h2>
                <div class="section-card-action">View &rarr;</div>
            </a>

            <a href="#" class="section-card">
                <h2 class="section-card-title">Leaderboard</h2>
                <div class="section-card-action">View &rarr;</div>
            </a>

        </div>

        <div class="back-container">
            <a href="bracket-challenge.html" class="back-btn">&larr; Back to Bracket Challenge</a>
        </div>

    </main>

    <footer>
        <span>&copy; 2026 The Eurostep | Basketball Analysis. All rights reserved.</span>
        <a href="privacy.html">Privacy Policy</a>
    </footer>

    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.015,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 3;

        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) / 500;
            mouseY = (event.clientY - window.innerHeight / 2) / 500;
        });

        function animate() {
            requestAnimationFrame(animate);
            targetX = mouseX * 0.5;
            targetY = mouseY * 0.5;

            particlesMesh.rotation.y += 0.001 + (targetX - particlesMesh.rotation.y) * 0.05;
            particlesMesh.rotation.x += 0.001 + (targetY - particlesMesh.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
