<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Teams & Rosters | The Eurostep</title>
    <link rel="icon" type="image/png" href="the eurostep rounded.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #030508; color: #f3f4f6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 45px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(3, 5, 8, 0.92); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; }
        .brand-container { display: flex; align-items: center; gap: 12px; text-decoration: none; transition: transform 0.3s ease, filter 0.3s ease; }
        .brand-container:hover { transform: scale(1.02); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4)); }
        .brand-logo { height: 52px; width: auto; object-fit: contain; }
        .brand-title-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 1.5px; background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .nav-menu { display: flex; align-items: center; gap: 35px; list-style: none; }
        .nav-link { color: #d1d5db; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 0; transition: color 0.3s ease; display: block; }
        .nav-link:hover { color: #ffffff; }

        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; z-index: 1; width: 100%; display: flex; flex-direction: column; gap: 30px; }
        .page-header-section { text-align: center; }
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: #ffffff; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; }
        .page-subtitle { color: #9ca3af; font-size: 0.95rem; }

        .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .team-card { background: rgba(11, 15, 25, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; backdrop-filter: blur(12px); transition: all 0.3s ease; }
        .team-card:hover { border-color: rgba(249, 115, 22, 0.5); background: rgba(15, 22, 36, 0.85); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .team-logo { width: 50px; height: 50px; object-fit: contain; }
        .team-name { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: #ffffff; font-weight: 700; }

        .roster-section { display: none; flex-direction: column; gap: 20px; }
        .roster-header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; background: rgba(11, 15, 25, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 14px; backdrop-filter: blur(12px); }
        .team-info-box h2 { font-family: 'Orbitron', sans-serif; color: #ffffff; font-size: 1.4rem; }
        
        .back-to-teams-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #ffffff; padding: 10px 18px; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; }
        .back-to-teams-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(249, 115, 22, 0.5); }

        /* Stile Tabella Professionale */
        .table-container { width: 100%; overflow-x: auto; background: rgba(11, 15, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; backdrop-filter: blur(12px); }
        .roster-table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        .roster-table th { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; letter-spacing: 1px; color: #9ca3af; background: rgba(255, 255, 255, 0.03); padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .roster-table td { padding: 16px 20px; font-size: 0.9rem; color: #f3f4f6; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .roster-table tbody tr { transition: background 0.2s ease; }
        .roster-table tbody tr:hover { background: rgba(255, 255, 255, 0.04); }
        .player-full-name { font-family: 'Orbitron', sans-serif; font-weight: 700; color: #ffffff; }

        .loading-text { text-align: center; padding: 40px; color: #9ca3af; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; width: 100%; }

        footer { text-align: center; padding: 25px; border-top: 1px solid rgba(255, 255, 255, 0.05); color: #4b5563; font-size: 0.85rem; letter-spacing: 1px; z-index: 1; display: flex; justify-content: center; gap: 20px; align-items: center; }
        footer a { color: #6b7280; text-decoration: none; transition: color 0.2s ease; }
        footer a:hover { color: #ffffff; }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    <header>
        <a href="index.html" class="brand-container" title="The Eurostep Home">
            <img src="the eurostep rounded.png" alt="The Eurostep Logo" class="brand-logo">
            <span class="brand-title-text">The Eurostep</span>
        </a>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Home</a></li>
        </ul>
    </header>

    <main class="container">
        <div class="page-header-section">
            <h1 class="page-title">NBA Teams & Rosters</h1>
            <p class="page-subtitle">All the NBA teams and players, updated daily.</p>
        </div>

        <div id="teamsView" class="teams-grid">
            <div class="loading-text">Loading NBA teams...</div>
        </div>

        <div id="rosterView" class="roster-section">
            <div class="roster-header-row">
                <div class="team-info-box">
                    <h2 id="selectedTeamTitle"></h2>
                </div>
                <button class="back-to-teams-btn" onclick="showTeamsView()">&larr; Back to Teams</button>
            </div>
            <div class="table-container">
                <table class="roster-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>PLAYER</th>
                            <th>POS</th>
                            <th>HEIGHT</th>
                            <th>WEIGHT</th>
                            <th>DATE OF BIRTH</th>
                            <th>BIRTHPLACE</th>
                            <th>EXPERIENCE</th>
                        </tr>
                    </thead>
                    <tbody id="playersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <span>&copy; 2026 The Eurostep | Basketball Analysis. All rights reserved.</span>
        <a href="privacy.html">Privacy Policy</a>
    </footer>

    <script>
        let globalData = null;
        let teamsMap = {};

        async function loadData() {
            try {
                const res = await fetch('nba-rosters.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error('File non trovato');
                globalData = await res.json();
                
                globalData.teams.forEach(t => { teamsMap[t.code] = t; });
                renderTeams(globalData.teams);
            } catch (err) {
                console.error(err);
                document.getElementById('teamsView').innerHTML = '<div class="loading-text">Syncing daily NBA rosters feed in progress...</div>';
            }
        }

        function renderTeams(teams) {
            const grid = document.getElementById('teamsView');
            grid.innerHTML = "";
            if (!teams || teams.length === 0) {
                grid.innerHTML = '<div class="loading-text">No teams available right now.</div>';
                return;
            }
            teams.forEach(t => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.onclick = () => openRoster(t.code);
                card.innerHTML = `
                    <img src="${t.image || ''}" alt="${t.name}" class="team-logo" onerror="this.src='the eurostep rounded.png'">
                    <span class="team-name">${t.name}</span>
                `;
                grid.appendChild(card);
            });
        }

        function openRoster(teamCode) {
            const team = teamsMap[teamCode];
            if (!team) return;

            document.getElementById('teamsView').style.display = 'none';
            document.getElementById('rosterView').style.display = 'flex';
            document.getElementById('selectedTeamTitle').textContent = team.name;

            const tbody = document.getElementById('playersTableBody');
            tbody.innerHTML = "";

            const players = globalData.rosters[teamCode] || [];
            if (players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="loading-text">No players found for this team.</td></tr>';
                return;
            }

            players.forEach(p => {
                const tr = document.createElement('tr');
                
                let formattedBirthDate = p.birthDate || 'N/A';
                if (p.birthDate && p.birthDate !== 'N/A') {
                    const dateObj = new Date(p.birthDate);
                    if (!isNaN(dateObj)) {
                        formattedBirthDate = dateObj.toLocaleDateString();
                    }
                }

                tr.innerHTML = `
                    <td style="font-weight: 700; color: #f97316;">${p.number}</td>
                    <td class="player-full-name">${p.name || ''} ${p.surname || ''}</td>
                    <td><span style="background: rgba(255,255,255,0.06); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600;">${p.position || 'N/A'}</span></td>
                    <td>${p.height || 'N/A'}</td>
                    <td>${p.weight || 'N/A'}</td>
                    <td>${formattedBirthDate}</td>
                    <td style="color: #9ca3af; font-size: 0.85rem;">${p.birthPlace || 'N/A'}</td>
                    <td>${p.experience || 'N/A'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showTeamsView() {
            document.getElementById('rosterView').style.display = 'none';
            document.getElementById('teamsView').style.display = 'grid';
        }

        loadData();

        // Canvas 3D Background
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 10;
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({ size: 0.015, color: 0xffffff, transparent: true, opacity: 0.6 }));
        scene.add(particlesMesh);
        camera.position.z = 3;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / 500;
            mouseY = (e.clientY - window.innerHeight / 2) / 500;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001 + (mouseX * 0.5 - particlesMesh.rotation.y) * 0.05;
            particlesMesh.rotation.x += 0.001 + (mouseY * 0.5 - particlesMesh.rotation.x) * 0.05;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
