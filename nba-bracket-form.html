<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Bracket Form | The Eurostep</title>
    <link rel="icon" type="image/png" href="the eurostep rounded.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #030508; color: #f3f4f6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 45px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(3, 5, 8, 0.92); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; }
        .brand-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-logo { height: 52px; width: auto; object-fit: contain; }
        .brand-title-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 1.5px; background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .nav-menu { display: flex; align-items: center; gap: 35px; list-style: none; }
        .nav-link { color: #d1d5db; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
        .nav-link:hover { color: #ffffff; }
        .content-container { max-width: 750px; margin: auto; padding: 50px 30px; text-align: center; z-index: 1; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 2.8rem; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; }
        .page-subtitle { color: #9ca3af; font-size: 1.05rem; line-height: 1.6; max-width: 600px; }
        .back-btn { display: inline-block; margin-top: 15px; padding: 12px 24px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #ffffff; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; letter-spacing: 1px; transition: all 0.3s ease; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
        footer { text-align: center; padding: 25px; border-top: 1px solid rgba(255, 255, 255, 0.05); color: #4b5563; font-size: 0.85rem; letter-spacing: 1px; z-index: 1; display: flex; justify-content: center; gap: 20px; align-items: center; }
        footer a { color: #6b7280; text-decoration: none; }
        footer a:hover { color: #ffffff; }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    <header>
        <a href="index.html" class="brand-container"><img src="the eurostep rounded.png" class="brand-logo"><span class="brand-title-text">The Eurostep</span></a>
        <ul class="nav-menu"><li><a href="index.html" class="nav-link">Home</a></li></ul>
    </header>
    <main class="content-container">
        <h1 class="page-title">Coming soon</h1>
        <p class="page-subtitle">The Playoffs are still a long way off. Check back later to access this section.</p>
        <div><a href="nba-bracket.html" class="back-btn">&larr; Back to NBA Playoffs</a></div>
    </main>
    <footer>
        <span>&copy; 2026 The Eurostep. All rights reserved.</span>
        <a href="privacy.html">Privacy Policy</a>
    </footer>
    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 10; }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.015, color: 0xffffff, transparent: true, opacity: 0.6 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        camera.position.z = 3;
        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.001;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
