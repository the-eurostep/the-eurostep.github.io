<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euroleague Game Center | The Eurostep</title>
    <link rel="icon" type="image/png" href="the eurostep rounded.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #030508; color: #f3f4f6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 45px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(3, 5, 8, 0.92); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; }
        .brand-container { display: flex; align-items: center; gap: 12px; text-decoration: none; transition: transform 0.3s ease, filter 0.3s ease; }
        .brand-container:hover { transform: scale(1.02); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4)); }
        .brand-logo { height: 52px; width: auto; object-fit: contain; }
        .brand-title-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 1.5px; background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .nav-menu { display: flex; align-items: center; gap: 35px; list-style: none; }
        .nav-link { color: #d1d5db; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 0; transition: color 0.3s ease; display: block; }
        .nav-link:hover { color: #ffffff; }

        .games-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; z-index: 1; width: 100%; display: flex; flex-direction: column; gap: 25px; }
        .games-header-section { text-align: center; }
        .games-page-title { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: #ffffff; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; }
        .games-page-subtitle { color: #9ca3af; font-size: 0.95rem; }

        /* Selettore dei 38 Round a scorrimento */
        .rounds-scroll-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: rgba(96, 165, 250, 0.4) rgba(11, 15, 25, 0.8); }
        .rounds-scroll-container::-webkit-scrollbar { height: 8px; }
        .rounds-scroll-container::-webkit-scrollbar-track { background: rgba(11, 15, 25, 0.8); border-radius: 4px; }
        .rounds-scroll-container::-webkit-scrollbar-thumb { background: rgba(96, 165, 250, 0.4); border-radius: 4px; }
        
        .round-btn { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; padding: 10px 20px; background: rgba(11, 15, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; color: #9ca3af; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; text-transform: uppercase; }
        .round-btn.active, .round-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(96, 165, 250, 0.4); color: #ffffff; box-shadow: 0 0 15px rgba(96, 165, 250, 0.1); }

        /* Lista delle Partite */
        .matches-list { display: flex; flex-direction: column; gap: 15px; }
        .match-card { background: rgba(11, 15, 25, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; backdrop-filter: blur(12px); overflow: hidden; transition: all 0.3s ease; }
        .match-card:hover { border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); }
        
        .match-main-row { padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; flex-wrap: wrap; gap: 15px; }
        .match-info { font-size: 0.8rem; color: #9ca3af; font-family: 'Orbitron', sans-serif; min-width: 120px; }
        
        .teams-matchup { display: flex; align-items: center; gap: 30px; flex: 1; justify-content: center; }
        .team-box { display: flex; align-items: center; gap: 12px; width: 220px; }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-logo { width: 32px; height: 32px; object-fit: contain; }
        .team-name { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: #9ca3af; }
        .team-name.winner { color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }

        .score-box { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; color: #ffffff; background: rgba(255, 255, 255, 0.04); padding: 6px 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); min-width: 90px; text-align: center; }
        .score-box.upcoming { font-size: 0.9rem; color: #9ca3af; font-weight: 600; }

        /* Box Score Espandibile (Accordion) */
        .boxscore-section { display: none; background: rgba(7, 10, 16, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 25px; }
        .match-card.expanded .boxscore-section { display: block; }
        
        .boxscore-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #ffffff; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; border-left: 3px solid #60a5fa; padding-left: 10px; }
        .table-responsive { overflow-x: auto; margin-bottom: 25px; }
        .boxscore-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; white-space: nowrap; }
        .boxscore-table th { background: rgba(15, 22, 36, 0.95); color: #9ca3af; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .boxscore-table td { padding: 10px 12px; color: #d1d5db; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .boxscore-table tr:hover td { background: rgba(255, 255, 255, 0.03); color: #ffffff; }

        .loading-text { text-align: center; padding: 40px; color: #9ca3af; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }

        .back-home-container { display: flex; justify-content: center; margin-top: 10px; }
        .back-home-btn { display: inline-block; padding: 10px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #ffffff; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 1px; transition: all 0.3s ease; }
        .back-home-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }

        footer { text-align: center; padding: 25px; border-top: 1px solid rgba(255, 255, 255, 0.05); color: #4b5563; font-size: 0.85rem; letter-spacing: 1px; z-index: 1; display: flex; justify-content: center; gap: 20px; align-items: center; }
        footer a { color: #6b7280; text-decoration: none; transition: color 0.2s ease; }
        footer a:hover { color: #ffffff; }
        @media (max-width: 768px) { header { padding: 15px 20px; } .teams-matchup { flex-direction: column; gap: 10px; } .team-box.home { justify-content: center; text-align: center; } .team-box.away { justify-content: center; text-align: center; } }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    <header>
        <a href="index.html" class="brand-container" title="The Eurostep Home">
            <img src="the eurostep rounded.png" alt="The Eurostep Logo" class="brand-logo">
            <span class="brand-title-text">The Eurostep</span>
        </a>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Back</a></li>
        </ul>
    </header>

    <main class="games-container">
        <div class="games-header-section">
            <h1 class="games-page-title">Euroleague Game Center</h1>
            <p class="games-page-subtitle">Schedules, results, and detailed box scores for all 38 rounds.</p>
        </div>

        <!-- Selettore dei 38 Round -->
        <div class="rounds-scroll-container" id="roundsSelector">
            <!-- Generato via JS -->
        </div>

        <!-- Lista Partite del Round selezionato -->
        <div class="matches-list" id="matchesList">
            <div class="loading-text">Loading Game Center...</div>
        </div>

        <div class="back-home-container">
            <a href="index.html" class="back-home-btn">&larr; Back to Home</a>
        </div>
    </main>

    <footer>
        <span>&copy; 2026 The Eurostep | Basketball Analysis. All rights reserved.</span>
        <a href="privacy.html">Privacy Policy</a>
    </footer>

    <script>
        let allSeasonData = {};
        let currentRound = 1;

        async function loadGameCenterData() {
            try {
                const response = await fetch('euroleague-games-data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('File dati non trovato');
                allSeasonData = await response.json();
                
                buildRoundsSelector();
                // Trova di default l'ultimo round giocato o imposta 1
                currentRound = allSeasonData.currentRound || 1;
                selectRound(currentRound);
            } catch (err) {
                console.error("Errore caricamento Game Center:", err);
                document.getElementById('roundsSelector.innerHTML') = '';
                document.getElementById('matchesList').innerHTML = '<div class="loading-text">Syncing game schedule in progress...</div>';
            }
        }

        function buildRoundsSelector() {
            const selector = document.getElementById('roundsSelector');
            selector.innerHTML = '';
            for (let i = 1; i <= 38; i++) {
                const btn = document.createElement('button');
                btn.className = `round-btn ${i === currentRound ? 'active' : ''}`;
                btn.innerText = `Round ${i}`;
                btn.onclick = () => selectRound(i);
                selector.appendChild(btn);
            }
        }

        function selectRound(roundNum) {
            currentRound = roundNum;
            document.querySelectorAll('.round-btn').forEach((btn, idx) => {
                if (idx + 1 === roundNum) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderMatches(roundNum);
        }

        function renderMatches(roundNum) {
            const container = document.getElementById('matchesList');
            const rounds = allSeasonData.rounds || {};
            const matches = rounds[roundNum] || [];

            if (matches.length === 0) {
                container.innerHTML = `<div class="loading-text">No games scheduled for Round ${roundNum}.</div>`;
                return;
            }

            container.innerHTML = '';
            matches.forEach((m, index) => {
                const isPlayed = m.status === 'played';
                const homeWinner = isPlayed && m.homeScore > m.awayScore;
                const awayWinner = isPlayed && m.awayScore > m.homeScore;

                const card = document.createElement('div');
                card.className = 'match-card';
                card.id = `match-${roundNum}-${index}`;

                let mainRowHTML = `
                    <div class="match-main-row" onclick="toggleBoxScore('${roundNum}-${index}', ${isPlayed})">
                        <div class="match-info">${m.date || ''} <br><strong>${m.time || ''}</strong></div>
                        <div class="teams-matchup">
                            <div class="team-box home">
                                <span class="team-name ${homeWinner ? 'winner' : ''}">${m.homeTeam}</span>
                                <img src="${m.homeLogo || 'the eurostep rounded.png'}" alt="" class="team-logo">
                            </div>
                            <div class="score-box ${isPlayed ? '' : 'upcoming'}">
                                ${isPlayed ? `${m.homeScore} - ${m.awayScore}` : 'VS'}
                            </div>
                            <div class="team-box away">
                                <img src="${m.awayLogo || 'the eurostep rounded.png'}" alt="" class="team-logo">
                                <span class="team-name ${awayWinner ? 'winner' : ''}">${m.awayTeam}</span>
                            </div>
                        </div>
                        <div class="match-info" style="text-align: right; color: ${isPlayed ? '#60a5fa' : '#9ca3af'}">
                            ${isPlayed ? 'Box Score &rarr;' : 'Upcoming'}
                        </div>
                    </div>
                `;

                let boxScoreHTML = '';
                if (isPlayed && m.boxscore) {
                    boxScoreHTML = `
                        <div class="boxscore-section">
                            <div class="boxscore-title">${m.homeTeam} Statistics</div>
                            ${renderTeamTable(m.boxscore.homePlayers)}
                            <div class="boxscore-title" style="margin-top: 20px;">${m.awayTeam} Statistics</div>
                            ${renderTeamTable(m.boxscore.awayPlayers)}
                        </div>
                    `;
                }

                card.innerHTML = mainRowHTML + boxScoreHTML;
                container.appendChild(card);
            });
        }

        function renderTeamTable(players) {
            if (!players || players.length === 0) return '<p style="color:#9ca3af; font-size:0.85rem; padding: 10px;">No box score data available.</p>';
            
            let rows = '';
            players.forEach(p => {
                rows += `<tr>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.min}</td>
                    <td><strong>${p.pts}</strong></td>
                    <td>${p.oreb}</td>
                    <td>${p.dreb}</td>
                    <td><strong>${p.reb}</strong></td>
                    <td>${p.ast}</td>
                    <td>${p.stl}</td>
                    <td>${p.blk}</td>
                    <td>${p.tpm2 || 0}</td>
                    <td>${p.tpa2 || 0}</td>
                    <td>${p.tp_pct2 || '.000'}</td>
                    <td>${p.tpm3 || 0}</td>
                    <td>${p.tpa3 || 0}</td>
                    <td>${p.tp_pct3 || '.000'}</td>
                    <td>${p.ftm || 0}</td>
                    <td>${p.fta || 0}</td>
                    <td>${p.ft_pct || '.000'}</td>
                    <td>${p.to || 0}</td>
                    <td>${p.pf || 0}</td>
                    <td><strong>${p.pir}</strong></td>
                    <td>${p.plusMinus || '0'}</td>
                </tr>`;
            });

            return `
                <div class="table-responsive">
                    <table class="boxscore-table">
                        <thead>
                            <tr>
                                <th>PLAYER</th>
                                <th>MIN</th>
                                <th>PTS</th>
                                <th>OREB</th>
                                <th>DREB</th>
                                <th>REB</th>
                                <th>AST</th>
                                <th>STL</th>
                                <th>BLK</th>
                                <th>2PM</th>
                                <th>2PA</th>
                                <th>2P%</th>
                                <th>3PM</th>
                                <th>3PA</th>
                                <th>3P%</th>
                                <th>FTM</th>
                                <th>FTA</th>
                                <th>FT%</th>
                                <th>TO</th>
                                <th>PF</th>
                                <th>PIR</th>
                                <th>+/-</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function toggleBoxScore(matchId, isPlayed) {
            if (!isPlayed) return;
            const card = document.getElementById(`match-${matchId}`);
            if (card) {
                card.classList.toggle('expanded');
            }
        }

        loadGameCenterData();

        // Canvas 3D Background
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 10;
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({ size: 0.015, color: 0xffffff, transparent: true, opacity: 0.6 }));
        scene.add(particlesMesh);
        camera.position.z = 3;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / 500;
            mouseY = (e.clientY - window.innerHeight / 2) / 500;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001 + (mouseX * 0.5 - particlesMesh.rotation.y) * 0.05;
            particlesMesh.rotation.x += 0.001 + (mouseY * 0.5 - particlesMesh.rotation.x) * 0.05;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
