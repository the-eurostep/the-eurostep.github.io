name: Update Euroleague Stats

on:
  schedule:
    # Si attiva automaticamente ogni giorno alle 4:00 del mattino (ora UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Ti permette anche di avviarlo a mano quando vuoi con un click

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Esegui script di aggiornamento
        run: python update_stats.py

      - name: Salva e aggiorna il file JSON su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add euroleague-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico statistiche Euroleague" && git push)
