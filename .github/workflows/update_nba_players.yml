name: Update NBA Rosters

on:
  schedule:
    - cron: '0 8 * * *'  # Ogni giorno alle 08:00 UTC (09:00 italiane)
  workflow_dispatch: # Permette anche il lancio manuale da GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_nba_rosters.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nba-rosters.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NBA rosters [skip ci]" && git push)
