# Ogni giorno fa una piccola richiesta a Supabase, così il progetto gratuito
# non va in pausa per inattività. Legge url e chiave da js/supabase-config.js.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o "url: *'[^']*'" js/supabase-config.js | sed "s/.*'\(.*\)'/\1/" | sed 's:/*$::')
          KEY=$(grep -o "key: *'[^']*'" js/supabase-config.js | sed "s/.*'\(.*\)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "js/supabase-config.js non è ancora compilato"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/get_comments" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"p_article_id":"keepalive"}')
          echo "Risposta di Supabase: $CODE"
          [ "$CODE" = "200" ]
