name: Update Euroleague Rosters Daily

on:
  schedule:
    - cron: '0 4 * * *' # Ore 04:00 UTC corrispondono alle 05:00 italiane (solare) / 06:00 (legale)
  workflow_dispatch: # Permette anche il lancio manuale da GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run scraper script
        run: python update_euroleague_rosters.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add euroleague-rosters.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Euroleague rosters [skip ci]" && git push)
