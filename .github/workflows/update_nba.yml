name: Update NBA Games Data

on:
  schedule:
    - cron: '0 9 * * *' # Ogni giorno alle 09:00 UTC
  workflow_dispatch: # Permette l'avvio manuale dal sito di GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run scraper script
        run: python update_nba_games.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add nba-games-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NBA games data [skip ci]" && git push)
