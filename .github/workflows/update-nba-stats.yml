name: Update NBA Stats

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nba-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests nba_api

      - name: Esegui script di verifica NBA
        run: python update_nba_stats.py

      - name: Salva e aggiorna il file JSON su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add nba-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico statistiche NBA" && git push)
