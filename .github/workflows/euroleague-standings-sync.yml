name: Daily Euroleague Standings Sync

on:
  schedule:
    # Esegue ogni giorno alle 2:00 UTC (corrispondenti alle 3:00 ora italiana)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permette l'esecuzione manuale da GitHub

jobs:
  update-el-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests html5lib lxml

      - name: Run Euroleague Standings Python script
        run: python update_euroleague_standings.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add euroleague-standings-data.json
          git commit -m "Auto-update Euroleague standings json [skip ci]" || exit 0
          git push
